<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>炬日式燒肉飯｜線上訂餐系統</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --ink: #231f1a;
      --charcoal: #332c26;
      --paper: #f7f1e8;
      --paper-deep: #eee2d2;
      --cream: #fffaf3;
      --ember: #c94d2d;
      --ember-dark: #9f351f;
      --gold: #b9823d;
      --gold-light: #e8c78d;
      --line: #e3d5c2;
      --green: #2f7d59;
    }

    * {
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        "PingFang TC",
        "Helvetica Neue",
        Arial,
        sans-serif;
      background:
        radial-gradient(circle at top right, rgba(201, 77, 45, .08), transparent 28rem),
        radial-gradient(circle at left bottom, rgba(185, 130, 61, .10), transparent 24rem),
        var(--paper);
      color: var(--ink);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1e7d9;
      border-radius: 999px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #c9b6a0;
      border-radius: 999px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #a98d70;
    }

    .hide-scroll::-webkit-scrollbar {
      display: none;
    }

    .hide-scroll {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .paper-card {
      background: rgba(255, 250, 243, .92);
      border: 1px solid rgba(227, 213, 194, .95);
      box-shadow:
        0 12px 35px rgba(67, 44, 27, .08),
        0 2px 8px rgba(67, 44, 27, .04);
      backdrop-filter: blur(12px);
    }

    .brand-gradient {
      background:
        radial-gradient(circle at 80% 10%, rgba(255, 208, 133, .22), transparent 16rem),
        linear-gradient(135deg, #241f1a 0%, #3b3027 48%, #7a3322 100%);
    }

    .ember-gradient {
      background:
        linear-gradient(135deg, #a63d26 0%, #c94d2d 45%, #d86d39 100%);
    }

    .gold-gradient {
      background:
        linear-gradient(135deg, #9c682e 0%, #c89a50 55%, #e0bd7b 100%);
    }

    .logo-seal {
      position: relative;
      background:
        radial-gradient(circle, rgba(255,255,255,.08) 1px, transparent 1px);
      background-size: 5px 5px;
      border: 2px solid rgba(232, 199, 141, .8);
      box-shadow:
        inset 0 0 0 5px rgba(201, 77, 45, .28),
        0 8px 20px rgba(0,0,0,.22);
    }

    .menu-card {
      position: relative;
      overflow: hidden;
      transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease;
    }

    .menu-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: linear-gradient(
        180deg,
        var(--ember),
        var(--gold)
      );
      opacity: .9;
    }

    .menu-card:hover {
      transform: translateY(-3px);
      border-color: rgba(201, 77, 45, .55);
      box-shadow:
        0 18px 35px rgba(67, 44, 27, .13),
        0 3px 8px rgba(67, 44, 27, .06);
    }

    .menu-card:active {
      transform: scale(.98);
    }

    .category-btn {
      transition: all .2s ease;
    }

    .category-btn.active {
      color: white;
      background:
        linear-gradient(135deg, #9f351f, #c94d2d);
      border-color: #9f351f;
      box-shadow: 0 7px 18px rgba(201, 77, 45, .22);
    }

    .radio-option,
    .check-option {
      transition: all .18s ease;
    }

    .radio-option:hover,
    .check-option:hover {
      border-color: rgba(201, 77, 45, .6);
      background: #fff7ef;
    }

    .radio-option.selected,
    .check-option.selected {
      border-color: var(--ember);
      background: #fff1e8;
      box-shadow: 0 0 0 3px rgba(201, 77, 45, .08);
    }

    .modal-overlay {
      animation: fadeIn .2s ease-out forwards;
    }

    .modal-content {
      animation: scaleIn .22s ease-out forwards;
    }

    @media (max-width: 640px) {
      .modal-content.bottom-sheet {
        margin-top: auto;
        border-radius: 1.6rem 1.6rem 0 0 !important;
        animation: slideUp .3s ease-out forwards;
        max-height: 92vh;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleIn {
      from {
        transform: scale(.96);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }
      to {
        transform: translateY(0);
      }
    }

    .float-ember {
      animation: floatEmber 3.8s ease-in-out infinite;
    }

    @keyframes floatEmber {
      0%, 100% {
        transform: translateY(0);
        opacity: .7;
      }
      50% {
        transform: translateY(-6px);
        opacity: 1;
      }
    }

    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }

    input,
    textarea,
    button {
      font: inherit;
    }

    input:focus,
    textarea:focus {
      outline: none;
    }

    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .disabled-look {
      opacity: .48;
      pointer-events: none;
      filter: grayscale(.15);
    }
  </style>
</head>

<body class="min-h-screen pb-24 lg:pb-10">

  <header class="brand-gradient sticky top-0 z-40 border-b border-black/20 shadow-xl">
    <div class="max-w-7xl mx-auto px-4 py-3">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">

        <div class="flex items-center gap-3">
          <div class="logo-seal w-12 h-12 rounded-full flex items-center justify-center text-2xl font-black text-[#f5cf91]">
            炬
          </div>

          <div>
            <h1 class="text-white font-black tracking-[.15em] text-xl sm:text-2xl">
              炬日式燒肉飯
            </h1>
            <p class="text-[#e8c78d] text-[10px] sm:text-xs tracking-[.22em] mt-0.
